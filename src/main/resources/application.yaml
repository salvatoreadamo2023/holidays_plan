spring:
  application:
    name: holidays_plan_v1
  
  datasource:
    # Usa la variabile DB_URL, se non esiste usa localhost (comodo per i test rapidi)
    url: ${DB_URL}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # Dialetto aggiornato per MySQL 8 (quello usato da Aiven)
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  # Render assegna la porta dinamicamente tramite la variabile PORT
  # Se non trova nulla, usa la 8080 (locale)
  port: ${PORT:8080}