spring:
  application:
    name: holidays-plan
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Email via SMTP (Amazon SES come Digisol): SPRING_MAIL_HOST=email-smtp.eu-west-1.amazonaws.com,
  # SPRING_MAIL_PORT=587, SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD = credenziali SMTP di SES.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # In produzione DEVE essere impostata (almeno 32 caratteri casuali)
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:8}
  cors:
    # Origini separate da virgola; vuoto = solo stessa origine
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  login:
    max-attempts: 5
    lock-minutes: 15
  # Indirizzo pubblico del sito, usato nei link delle email (reset password, notifiche)
  base-url: ${APP_BASE_URL:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  # Primo Admin: creato solo se il DB non ha utenti e la password è impostata
  first-admin:
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:}
    email: ${ADMIN_INITIAL_EMAIL:admin@azienda.it}

management:
  health:
    # Il server SMTP non deve far risultare "giu'" l'applicazione
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
