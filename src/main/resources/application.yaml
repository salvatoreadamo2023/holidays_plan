spring:
  application:
    name: holidays-plan
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # In produzione DEVE essere impostata (almeno 32 caratteri casuali)
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:8}
  cors:
    # Origini separate da virgola; vuoto = solo stessa origine
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  login:
    max-attempts: 5
    lock-minutes: 15
  # Primo Admin: creato solo se il DB non ha utenti e la password è impostata
  first-admin:
    username: ${ADMIN_INITIAL_USERNAME:admin}
    password: ${ADMIN_INITIAL_PASSWORD:}
    email: ${ADMIN_INITIAL_EMAIL:admin@azienda.it}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
